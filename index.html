<script>
const $=s=>document.querySelector(s),RAW={},FILES={},PHYS={},LOG={sent:[],ret:[]};let LM=new Date().toISOString().slice(0,7),ORDC=[],PERS=false,META={},PEND=null;

const save=async()=>{const ok=await kv.set('data',{RAW,FILES,PHYS,LOG});const m=$('#sm2');if(m)cloudSoon();m.textContent=ok?'Saved in this browser'+(PERS?' (protected from automatic cleanup).':'. The browser may clear it if the device runs low on space, so keep backups.'):'Could not save in this browser. Use Save backup now.'};

let CL=(()=>{try{return JSON.parse(localStorage.getItem('mm_cloud'))||{}}catch(e){return{}}})(),KN={},CT=null,BUSY=false,AGAIN=false;

const hasLocal=()=>Object.keys(RAW).length||LOG.sent.length||LOG.ret.length||Object.keys(FILES).length;
async function connect(){CL.url=$('#cu').value.trim().replace(/\/$/,'');CL.key=$('#ck').value.trim();CL.email=$('#ce').value.trim();try{cs('Signing in...');await auth({email:CL.email,password:$('#cpw').value},'password');const rows=await pull();
 if(rows.length&&hasLocal()&&!confirm('The cloud already has data. OK = replace this device\'s data with the cloud data. Cancel = upload this device\'s data and replace the cloud copy.')){KN={};rows.forEach(r=>KN[r.key]='x');cloudSoon()}
 else if(rows.length){apply(rows);await kv.set('data',{RAW,FILES,PHYS,LOG});render()}else{KN={};cloudSoon()}drawCloud()}catch(e){CL.tok='';cs('Could not connect: '+e.message)}}

function drawCloud(){const e=$('#cc');if(!e)return;e.innerHTML=CL.tok?`<h2>Cloud sync</h2><div class="mu">Signed in as ${esc(CL.email)}. Every change is saved to Supabase as well as this browser.</div><div id="cst" class="mu">${META.ls?'Last synced '+esc(META.ls):''}</div><div class="row" style="margin-top:6px"><button onclick="push()">Sync now</button><button onclick="reloadCloud()">Reload from cloud</button><button onclick="signOut()">Sign out</button></div>`:`<h2>Cloud sync (Supabase)</h2><div class="row"><input id="cu" placeholder="Project URL" value="${esc(CL.url)}" style="flex:1 1 240px"><input id="ck" placeholder="Anon (public) key" value="${esc(CL.key)}" style="flex:1 1 240px"></div><div class="row" style="margin-top:6px"><input id="ce" type="email" placeholder="Email" value="${esc(CL.email)}"><input id="cpw" type="password" placeholder="Password"><button class="on" onclick="connect()">Sign in</button></div><div id="cst" class="mu">Data is only on this device until you sign in.</div>`}
const LS={d:'',k:''},td=()=>new Date().toISOString().slice(0,10),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fixUid=()=>LOG.ret.forEach(r=>{if(!r.uid)r.uid=(r.id||'x')+'|'+r.type+'|'+(r.ts||Math.random())});
function delS(id){LOG.sent=LOG.sent.filter(x=>x.id!==id);save();drawLog()}
let UNDO=null;
function delR(u){const e=LOG.ret.find(x=>x.uid===u);if(!e)return;const ph=e.id&&PHYS[e.id]?JSON.parse(JSON.stringify(PHYS[e.id])):null;LOG.ret=LOG.ret.filter(x=>x.uid!==u);if(e.id&&!LOG.ret.some(x=>x.id===e.id))delete PHYS[e.id];UNDO={e,ph};save();render();drawLog();const m=$('#rm');if(m)m.innerHTML='Return entry removed, along with its received check. <a href="#" onclick="undoR();return false">Undo</a>'}
function undoR(){if(!UNDO)return;LOG.ret.push(UNDO.e);if(UNDO.ph&&UNDO.e.id)PHYS[UNDO.e.id]=UNDO.ph;UNDO=null;save();render();drawLog()}
const nz=x=>String(x==null?'':x).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''),cl=v=>String(v==null?'':v).trim().replace(/\.0$/,'');
const dOf=v=>{if(typeof v==='number'&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const t=String(v==null?'':v).trim();let m=t.match(/^\d{4}-\d{2}-\d{2}/);if(m)return m[0];m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');const d=new Date(t);return isNaN(d)?'':d.toISOString().slice(0,10)};
const mlab=x=>x?new Date(x+'-01T00:00:00').toLocaleString('en-IN',{month:'short',year:'numeric'}):'All months';
function dlLog(all){const m=all?'':LM,byId={};ORDC.forEach(o=>byId[o.id]=o);const S=LOG.sent.filter(x=>x.date.startsWith(m)).sort((a,b)=>a.date<b.date?1:-1),R=LOG.ret.filter(x=>x.date.startsWith(m)).sort((a,b)=>a.date<b.date?1:-1),sk=id=>((LOG.sent.find(x=>x.id===id)||{}).sku)||((byId[id]||{}).sku)||'',mc=id=>{const o=byId[id];return !o?'Not in Myntra data':o.cat==='Cancelled'?'Cancelled':o.cat==='RTO'?'RTO':o.returned?'Returned':'Matches Myntra'};
 const A=S.map(x=>({'Sent date':x.date,'Order id':x.oid||'','Release id':x.id,'Packet id':x.pid||'','SKU':x.sku||sk(x.id),'Tracking id':x.tid||'','Status in file':x.st||'','Source file':x.src||'','Myntra check':mc(x.id)})),B=R.map(x=>({'Return date':x.date,'Order id':x.oid||'','Release id':x.id||'','Packet id':x.pid||'','SKU':x.sku||sk(x.id),'Tracking id':x.tid||'','Type':x.type,'Condition':x.cond==='ok'?'Good':x.cond,'Note':x.note||'','Myntra says':x.id?mc(x.id):''}));
 const wb=XLSX.utils.book_new(),sh=(rows,h)=>{const w=XLSX.utils.json_to_sheet(rows.length?rows:[Object.fromEntries(h.map(k=>[k,'']))]);w['!cols']=h.map(k=>({wch:Math.max(14,k.length+2)}));return w};
 XLSX.utils.book_append_sheet(wb,sh(A,['Sent date','Order id','Release id','Packet id','SKU','Tracking id','Status in file','Source file','Myntra check']),'Sent');XLSX.utils.book_append_sheet(wb,sh(B,['Return date','Order id','Release id','Packet id','SKU','Tracking id','Type','Condition','Note','Myntra says']),'Returns');
 dls('myntra-live-log-'+(m||'all-months')+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
const impPlan=()=>{const P=IMP,idx=new Map(LOG.sent.map(x=>[x.id,x])),seen=new Set();let nw=0,sk=0,fl=0;impPick().forEach(r=>{const id=cl(r[P.ir]);if(seen.has(id))return;seen.add(id);const e=idx.get(id);if(!e){nw++;return}const g=i=>i<0?'':cl(r[i]),f={oid:g(P.io),pid:g(P.ip),sku:g(P.is),tid:g(P.it)};if(Object.keys(f).some(q=>f[q]&&!e[q]))fl++;else sk++});return{nw,sk,fl}};
let MIMP=null;
function myPlan(){const R={},idx=new Map(LOG.sent.map(x=>[x.id,x])),add=[],fl=[],mon={};let sk=0,ns=0,nd=0;(RAW.pk||[]).forEach(r=>{const id=cl(r.order_release_id);if(id&&!R[id])R[id]=r});
 ORDC.forEach(o=>{if(!o.b)return;if(!o.b.pu&&!o.b.dl){ns++;return}const r=R[o.id]||{},d=MIMP.by==='date'?o.b.date:(o.b.pu||o.b.dl),f={oid:cl(r.order_id||r.store_order_id),pid:cl(r.store_packet_id||r.packet_id),sku:o.b.sku||'',tid:cl(r.tracking_id||r.tracking_number)},e=idx.get(o.id);
  if(e){if(Object.keys(f).some(q=>f[q]&&!e[q]))fl.push({e,f});else sk++;return}
  if(!d){nd++;return}add.push(Object.assign({id:o.id,date:d,src:'Myntra files',ts:Date.now(),st:''},f));mon[d.slice(0,7)]=(mon[d.slice(0,7)]||0)+1});

const myDraw=()=>{const e=$('#ip');if(e)e.innerHTML=myUI()},yn=v=>v?'found':'not in the file';
function myUI(){const p=myPlan(),ms=Object.keys(p.mon).sort().map(k=>mlab(k)+': '+p.mon[k]).join(', ');
return `<div class="nt"><b>Orders from your uploaded Myntra files</b>. An order counts as sent if it has a pickup or delivery date. ${p.ns} orders have neither (cancelled or never shipped) and are left out.
<div class="row" style="margin-top:6px"><label class="mu">Sent date</label><select onchange="MIMP.by=this.value;myDraw()"><option value="pu"${MIMP.by==='pu'?' selected':''}>Pickup date (delivery date if missing)</option><option value="date"${MIMP.by==='date'?' selected':''}>Order date</option></select></div>
<div class="mu" style="margin-top:6px">${p.add.length} new orders to add${ms?' ('+ms+')':''}. ${p.sk} are already in your sent log and will be skipped.${p.fl.length?' '+p.fl.length+' are already logged but missing details, which will be filled in.':''}${p.nd?' '+p.nd+' have no usable date and are left out.':''}</div>

<div class="row" style="margin-top:8px"><button class="on" onclick="myGo()"${p.add.length||p.fl.length?'':' disabled'}>Add ${p.add.length} orders to sent log</button><button onclick="MIMP=null;drawLog()">Cancel</button></div></div>`}

let IMP=null;
const impCnt=()=>{const c={};IMP.rows.forEach(r=>{const v=String(r[IMP.sc]).trim();c[v]=(c[v]||0)+1});return c},impPick=()=>IMP.rows.filter(r=>cl(r[IMP.ir])&&(IMP.sc<0||IMP.sel.has(String(r[IMP.sc]).trim())));
async function impSent(file){MIMP=null;try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});for(const nm of wb.SheetNames){const rs=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:''}),hi=rs.findIndex(r=>r.map(nz).includes('order_release_id'));if(hi<0)continue;
 const hdr=rs[hi].map(x=>String(x).trim()),nn=hdr.map(nz),f=k=>nn.indexOf(k),dc=['packed_on','sent_on','shipped_on','created_on'].map(f).find(i=>i>=0);
 IMP={name:file.name,hdr,rows:rs.slice(hi+1).filter(r=>r.some(x=>String(x).trim()!=='')),ir:f('order_release_id'),io:f('order_id'),ip:f('store_packet_id'),is:f('seller_sku_code'),it:f('tracking_id'),dc:dc===undefined?-1:dc,fd:$('#sd').value||td(),sc:f('status'),sel:new Set()};
 if(IMP.sc>=0)IMP.sel=new Set(Object.keys(impCnt()).filter(v=>v.toUpperCase()==='SHIPPED'));drawLog();return}
 IMP=null;drawLog();const m=$('#lm');if(m)m.textContent='No order_release_id column found in '+file.name+'.'}catch(e){const m=$('#lm');if(m)m.textContent='Could not read that file: '+e.message}}
